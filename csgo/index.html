<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CS Post Match Thread Creator</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- css -->
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/flair.css">
    <!-- js -->

    <script>
        window.jQuery || document.write('<script src="js/vendor/jquery-3.1.0.min.js"><\/script>')

<body>
    <div id="container">
        <div class="max-width float-left"> <strong id="createButton">Create</strong> <strong id="editButton">Edit</strong> <strong id="potatoButton">Potato</strong> <strong id="themeButton" onclick="changeTheme();">Switch Theme</strong> </div>
        <div class="clear-both"></div>
        <div class="max-width float-left">
            <hr> </div>
        <div class="clear-both"></div>
        <div id="create" class="float-left">
            <div class="max-width float-left"> <span id="loading">Loading teams...</span> </div>
            <div class="float-left max-width">
                <ul id="tabList">
                    <li n=1>Map 1</li>
                    <li n=2>Map 2</li>
                    <li n=3>Map 3</li>
                    <li n=4>Map 4</li>
                    <li n=5>Map 5</li>
                    <li n=6>Output</li>
                </ul>
            </div>
            <div id="panels" class="float-left">
                <div class="main">
                    <div class="teams-names">
                        <input class="tn1" list="TeamDataList" tabindex="1" placeholder="Team 1 Name">
                        <input class="tn2" list="TeamDataList" tabindex="2" placeholder="Team 2 Name"> </div>
                    <div class="teams">
                        <input class="T1" tabindex="2" placeholder="Team 1 icon" readonly>
                        <input class="T2" tabindex="3" placeholder="Team 2 icon" readonly> </div>
                    <div class="teams-initials">
                        <input class="ti1" tabindex="3" placeholder="Team 1 Initials" readonly>
                        <input class="ti2" tabindex="4" placeholder="Team 2 Initials" readonly> </div>
                    <div class="game-infos-poll">
                        <input type="text" placeholder="Poll" class="poll">
                        <!-- *** -->
                        <input type="button" value="Create" class="createPoll">
                        <!-- *** -->
                    </div>
                    <div class="pps">
                        <div>
                            <div class="playersl">
                                <input class="P1" placeholder="Player 1">
                                <input class="P2" placeholder="Player 2">
                                <input class="P3" placeholder="Player 3">
                                <input class="P4" placeholder="Player 4">
                                <input class="P5" placeholder="Player 5"> 
								<input class="PY" placeholder="Player 11"> </div>
                        </div>
                        <div>
                            <div class="playersr">
                                <input class="P6" placeholder="Player 6">
                                <input class="P7" placeholder="Player 7">
                                <input class="P8" placeholder="Player 8">
                                <input class="P9" placeholder="Player 9">
                                <input class="PX" placeholder="Player 10">
								<input class="PZ" placeholder="Player 12"> </div>
                        </div>
                    </div>
                    <div class="hltv-link">
                        <input type="text" placeholder="HLTV link" class="hltv"> </div>
                </div>
            </div>
        </div>
        <div style="display: none" id="edit">
            <textarea id="header"> ###%T1 %tn1 0-0 %T2 %tn2 **map name:** 0-0 **map name:** 0-0 ~~**map name:** 0-0~~ &amp;nbsp; ###[Who was the MVP for this series? (Poll)](%poll) ----- %team1info %team2info ----- * [event name goes here / Schedule &amp; Discussion](link to reddit discussion page goes here) * [Liquipedia page for event name goes here](link to liquipedia page goes here) * [For VoD's of this game check out /r/CSeventVODs](https://np.reddit.com/r/CSeventVODs/) ----- |%T1|**MAP**|%T2| |:--:|:--:|:--:| |**X**|[](#map-x)| | | |[](#map-x)|**X**| |**✓**|[](#map-x)|**CT/T**| |**CT/T**|[](#map-x)|**✓**| |**X**|[](#map-x)|| ||[](#map-x)|**X**| ||[](#map-x)|| ----- </textarea>
            <textarea id="main"> &amp;nbsp; ###MAP %gameX: %T1 %ti1 (CT/T) vs %T2 %ti2 (T/CT) **Map:** tbd |Team|CT|T|Total| |:--|:--:|:--:|:--:| |%T1 **%ti1**|0|0|**0**| | |**T**|**CT**| |%T2 **%ti2**|0|0|**0**| &amp;nbsp; |**%T1 %ti1**|K|A|D| |:--|--:|--:|--:|--:|--:| |%P1|0|0|0| |%P2|0|0|0| |%P3|0|0|0| |%P4|0|0|0| |%P5|0|0|0| |**%T2 %ti2**| |%P6|0|0|0| |%P7|0|0|0| |%P8|0|0|0| |%P9|0|0|0| |%PX|0|0|0| &amp;nbsp; ###[Map %gameX Detailed Stats](%hltv) &amp;nbsp; ----- </textarea>
            <textarea id="transition"></textarea>
            <textarea id="end"></textarea>
            <div id="saveandshit">
                <div id="save" class="button">SAVE</div>
                <input id="saveName">
                <div id="load" class="button">LOAD</div>
                <select>
                    <option value="hey">hey</option>
                </select>
            </div>
        </div>
        <div id="potato" style: "display: none" class: "hidden"> <img src="css/potatomine.png" alt="potato xd" height="150" width="150"> <img src="css/potatomine.png" alt="potato xd" height="150" width="150"> <img src="css/potatomine.png" alt="potato xd" height="150" width="150"> <img src="css/potatomine.png" alt="potato xd" height="150" width="150"> </div>
    </div>
    <script>
        window.jQuery || document.write('<script src="../js/vendor/jquery-1.10.2.min.js"><\/script>')
    </script>
    <script src="js/plugins.js"></script>
    <!--  <script src="js/teams.js"></script>-->
    <script src="js/jqueryUI.js"></script>
    <script>
        var TEAMS = {};
        $.post("getJSON.php", {
            feed: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRR5IYr0mCc-2Qut05BVRqfV_cwinWaD3GOLR-4R9JohvED5gJJPv0VeTxIkfm10LzSTX9zUYHQWvHa/pub?gid=0&single=true&output=csv"
        }).done(function(d) {
            console.log(JSON.stringify(d));
            for (i in d) {
                TEAMS[d[i]["Name"]] = d[i];
            }
            String.prototype.KWS = function() {
                return this.replace(/\s/g, '');
            };
            String.prototype.Flarify = function() {
                return "[" + this + "](/" + this.toLowerCase().KWS() + ")";
            }
            LB = {};
            LB.PMTC = {};
            LB.PMTC.roleId = {
                0: "PLAYER 1",
                1: "PLAYER 2",
                2: "PLAYER 3",
                3: "PLAYER 4",
                4: "PLAYER 5",
				5: "PLAYER 6"
            }
            $("#createButton").click(function() {
                $("#create").css("display", "inline-block");
                $("#edit").css("display", "none");
                $("#potato").addClass("hidden");
            });
            $("#editButton").click(function() {
                $("#edit").css("display", "inline-block");
                $("#create").css("display", "none");
                $("#potato").addClass("hidden");
            });
            $("#potatoButton").click(function() {
                $("#edit").css("display", "none");
                $("#create").css("display", "none");
                $("#potato").removeClass("hidden");
            });
            $("#tabList li").click(function() {
                index = $(this).index();
                $("#panels .main").css("display", "none");
                $("ul#tabList li:not(:nth-child(" + (index + 1) + "))").removeClass('selected');
                $("ul#tabList li:nth-child(" + (index + 1) + ")").addClass('selected');
                $("#panels .main:nth-child(" + (index + 1) + ")").css("display", "inline-block");
            });
            for (i = 0; i < 5; i++) {
                $(".main:nth-child(1)").clone().appendTo("#panels");
            }
            $("#panels > div:nth-child(6)").html("<textarea></textarea>");
            $("#tabList > li:nth-child(6)").click(function() {
                data = [];
                for (i = 1; i < 6; i++) {
                    if ($("#panels > div:nth-child(" + i + ") .T1 ").val() != "") {
                        data[i - 1] = {};
                        $("#panels > div:nth-child(" + i + ") input").each(function() {
                            if (!$(this).attr("o")) {
                                data[i - 1][$(this).attr("class")] = {};
                                data[i - 1][$(this).attr("class")].value = $(this).val();
                            }
                        });
                        data[i - 1]["winner"] = {};
                        data[i - 1]["winner"].value = $(".winner").val();
                        data[i - 1]["poll"] = {};
                        data[i - 1]["poll"].value = $(".poll").val();
                        data[i - 1]["extra1"] = {};
                        data[i - 1]["extra1"].value = $("#extra1").val();
                        data[i - 1]["extra2"] = {};
                        data[i - 1]["extra2"].value = $("#extra2").val();
                        data[i - 1]["gameX"] = {};
                        data[i - 1]["gameX"].value = i;
                        data[i - 1]["tn1"] = {};
                        data[i - 1]["tn1"].value = $(".tn1").val();
                        data[i - 1]["tn2"] = {};
                        data[i - 1]["tn2"].value = $(".tn2").val();
                        data[i - 1]["ti1"] = {};
                        data[i - 1]["ti1"].value = $("#panels > div:nth-child(" + i + ") .ti1").val();
                        data[i - 1]["ti2"] = {};
                        data[i - 1]["ti2"].value = $("#panels > div:nth-child(" + i + ") .ti2").val();
                        data[i - 1]["hltv"] = {};
                        data[i - 1]["hltv"].value = $(".hltv").val();
                        var index = 0;
                        $("#panels > div:nth-child(" + i + ") [o]").each(function() {
                            index++;
                            if (index === 10) {
                                index = "X";
                            }
                            data[i - 1]["C" + index] = {};
                            data[i - 1]["C" + index].value = $(this).val();
                            data[i - 1]["C" + index].order = $(this).attr("o");
                        });
                        T1ut = {
                            string: $("#panels > div:nth-child(" + i + ") .tn1").val()
                        }
                        T1ut.fb = "";
                        T1ut.tw = "";
                        T1ut.wk = "";
                        T1ut.os = "";
                        T1ut.yt = "";
                        T1ut.sb = "";
                        T1ut.logo = $(".T1").val();
                        if (TEAMS[T1ut.string]["Facebook"] != "") {
                            T1ut.fb = " | [Facebook](" + TEAMS[T1ut.string]["Facebook"] + ")" || "";
                        }
                        if (TEAMS[T1ut.string]["Twitter"] != "") {
                            T1ut.tw = " | [Twitter](" + TEAMS[T1ut.string]["Twitter"] + ")" || "";
                        }
                        if (TEAMS[T1ut.string]["Wiki"] != "") {
                            T1ut.wk = " | [Liquipedia](" + TEAMS[T1ut.string]["Wiki"] + ")" || "";
                        }
                        if (TEAMS[T1ut.string]["Official Site"] != "") {
                            T1ut.os = " | [Official Site](" + TEAMS[T1ut.string]["Official Site"] + ")" || "";
                        }
                        if (TEAMS[T1ut.string]["Youtube"] != "") {
                            T1ut.yt = " | [YouTube](" + TEAMS[T1ut.string]["Youtube"] + ")" || "";
                        }
                        if (TEAMS[T1ut.string]["Subreddit"] != "") {
                            T1ut.sb = " | [Subreddit](" + TEAMS[T1ut.string]["Subreddit"] + ")" || "";
                        }
                        data[i - 1]["team1info"] = {
                            value: T1ut.logo + " **" + T1ut.string + "**" + T1ut.wk + T1ut.os + T1ut.tw + T1ut.fb + T1ut.yt + T1ut.sb
                        };
                        T2ut = {
                            string: $("#panels > div:nth-child(" + i + ") .tn2").val()
                        }
                        T2ut.fb = "";
                        T2ut.tw = "";
                        T2ut.wk = "";
                        T2ut.os = "";
                        T2ut.yt = "";
                        T2ut.sb = "";
                        T2ut.logo = $(".T2").val();
                        if (TEAMS[T2ut.string]["Facebook"] != "") {
                            T2ut.fb = " | [Facebook](" + TEAMS[T2ut.string]["Facebook"] + ")" || "";
                        }
                        if (TEAMS[T2ut.string]["Twitter"] != "") {
                            T2ut.tw = " | [Twitter](" + TEAMS[T2ut.string]["Twitter"] + ")" || "";
                        }
                        if (TEAMS[T2ut.string]["Wiki"] != "") {
                            T2ut.wk = " | [Liquipedia](" + TEAMS[T2ut.string]["Wiki"] + ")" || "";
                        }
                        if (TEAMS[T2ut.string]["Official Site"] != "") {
                            T2ut.os = " | [Official Site](" + TEAMS[T2ut.string]["Official Site"] + ")" || "";
                        }
                        if (TEAMS[T2ut.string]["Youtube"] != "") {
                            T2ut.yt = " | [YouTube](" + TEAMS[T2ut.string]["Youtube"] + ")" || "";
                        }
                        if (TEAMS[T2ut.string]["Subreddit"] != "") {
                            T2ut.sb = " | [Subreddit](" + TEAMS[T2ut.string]["Subreddit"] + ")" || "";
                        }
                        data[i - 1]["team2info"] = {
                            value: T2ut.logo + " **" + T2ut.string + "**" + T2ut.wk + T2ut.os + T2ut.tw + T2ut.fb + T2ut.yt + T2ut.sb
                        };
                    }
                }
                var header = $("#header").val();
                var main = "";
                var transition = $("#transition").val();
                var string = "";
                main += header;
                for (i = 0; i < data.length; i++) {
                    main += transition;
                    main += $("#main").val()
                    for (j in data[i]) {
                        main = SearchReplace("%" + j, data[i][j], main)
                        console.log("%" + j, data[i][j])
                    }
                }
                main += $("#end").val();
                $("#panels > div:nth-child(6) textarea").val(string + main);
            });
            $(".createPoll").click(function() {
                console.log("Clicked on createPoll!");
                var team1 = '';
                team1 += '["' + $(".ti1").val() + '"';
                var index = 1;
                $("#panels .main:nth-child(1) .pps >div:nth-child(1) .playersl input").each(function() {
                    console.log("Index " + index + ": Player=" + $(this).val());
                    var ps = ' <span c=csgo />';
                    team1 += ', "' + $(this).val().replace("[]", "").replace(/\(.*?\)/, "") + ps + '"';
                    index++;
                });
                team1 += ']';
                var team2 = '';
                team2 += '["' + $(".ti2").val() + '"';
                var index = 1;
                $("#panels .main:nth-child(1) .pps >div:nth-child(2) .playersr input").each(function() {
                    console.log("Index " + index + ": Player=" + $(this).val());
                    var ps = ' <span c=csgo />';
                    team2 += ', "' + $(this).val().replace("[]", "").replace(/\(.*?\)/, "") + ps + '"';
                    index++;
                });
                team2 += ']';
                console.log("T1: " + team1);
                console.log("T2: " + team2);
                $.post("../poll/createPoll.php", {
                    TJ1: team1,
                    TJ2: team2
                }).done(function(d) {
                    $(".poll").val("http://lightbinding.net/poll/" + d);
                });
            });
            $.post("getJSON.php", {
                feed: "https://docs.google.com/spreadsheet/pub?key=0AneWTc0o_1bpdEVVczlDckt2aXpmX0tRUU01eUZMX3c&single=true&gid=8&output=csv"
            }).done(function(d) {
                var teamListArray = d;
                LB.PMTC.teamListObject = {};
                for (i = 0; i < teamListArray.length; i++) {
                    LB.PMTC.teamListObject[teamListArray[i].LOGO] = teamListArray[i];
                }
                console.log(LB.PMTC.teamListObject);
            });
            $(".tn1").blur(function() {
                var teamID = $(this).val();
                console.log("Team ID: " + teamID);
                $(this).closest(".main").find(".teams-initials input.ti1").each(function() {
                    $(this).val(TEAMS[teamID]["Initials"]);
                });
                $(this).closest(".main").find(".teams input.T1").each(function() {
                    $(this).val(TEAMS[teamID]["LOGO"]);
                });
                var index = 0;
                $(this).closest(".main").find(".pps > div:nth-child(1) .playersl input").each(function() {
                    $(this).val(TEAMS[teamID][LB.PMTC.roleId[index]]);
                    index++;
                });
            })
            $(".tn2").blur(function() {
                var teamID = $(this).val();
                console.log("Team ID: " + teamID);
                $(this).closest(".main").find(".teams-initials input.ti2").each(function() {
                    $(this).val(TEAMS[teamID]["Initials"]);
                });
                $(this).closest(".main").find(".teams input.T2").each(function() {
                    $(this).val(TEAMS[teamID]["LOGO"]);
                });
                var index = 0;
                $(this).closest(".main").find(".pps > div:nth-child(2) .playersr input").each(function() {
                    $(this).val(TEAMS[teamID][LB.PMTC.roleId[index]]);
                    index++;
                });
            })
            $(".hltv").blur(function() {
                $(this).closest('.main').find('.hltv').val($(this).val());
            })

            function get(id, game) {}

            function SearchReplace(match, replacer, string) {
                var length = match.length;
                var position = string.search(match);
                var id = match.split("%")[1];
                var newstr = string;
                console.log(position);
                if (string.charAt(position + length) === "f") {
                    newstr = string.replace(match + "f", replacer.value.Flarify());
                }
                var position = newstr.search(match);
                console.log(position);
                if (newstr.charAt(position + length) === "o") {
                    newstr = newstr.replace(match + "o", replacer.value + " ^" + replacer.order);
                    console.log("something")
                }
                return newstr.replace(new RegExp(match, "g"), replacer.value, "g");
            }
            LB.PMTC.loadAndParse = function(id, type) {
                var dataString = localStorage.getItem(id) || false;
                switch (type) {
                    case "object":
                        return JSON.parse(dataString) || {};
                        break;
                    case "array":
                        return JSON.parse(dataString) || [];
                        break;
                }
            }
            LB.PMTC.setSelect = function(saveData, JQdomID) {
                var list = [];
                for (var name in saveData) {
                    list.push("" + name);
                }
                console.log(list);
                $(JQdomID).html("");
                for (var name = 0; name < list.length; name++) {
                    $(JQdomID).append("<option value=" + list[name] + ">" + list[name] + "</option>");
                }
            }
            LB.PMTC.load = function(name) {
                LB.PMTC.saveData = LB.PMTC.loadAndParse("saves", "object");
                $("#header").val(LB.PMTC.saveData[name].header)
                $("#main").val(LB.PMTC.saveData[name].main)
                $("#transition").val(LB.PMTC.saveData[name].transition)
                $("#end").val(LB.PMTC.saveData[name].end)
                $("#saveName").val(name);
                localStorage.setItem("default", name);
            }
            datalist = document.createElement("datalist");
            console.log(datalist);
            datalist.id = "TeamDataList";
            teamnames = [];
            for (i in TEAMS) {
                var o = document.createElement("option");
                o.value = i;
                datalist.appendChild(o);
                teamnames.push(i);
            }
            document.body.appendChild(datalist);
            $(".picks").sortable();
            LB.PMTC.saveData = LB.PMTC.loadAndParse("saves", "object");
            LB.PMTC.setSelect(LB.PMTC.saveData, "select");
            var defaultTemplate = localStorage.getItem("default") || false;
            console.log(defaultTemplate);
            if (defaultTemplate) {
                LB.PMTC.load(defaultTemplate);
                $("select").val(defaultTemplate);
            }
            $("#save").click(function() {
                LB.PMTC.saveData = LB.PMTC.loadAndParse("saves", "object");
                if (typeof $("#saveName").val() != "undefined" && $("#saveName").val() != "") {
                    LB.PMTC.saveData[$("#saveName").val()] = {};
                    console.log(LB.PMTC.saveData);
                    LB.PMTC.saveData[$("#saveName").val()].header = $("#header").val();
                    LB.PMTC.saveData[$("#saveName").val()].main = $("#main").val();
                    LB.PMTC.saveData[$("#saveName").val()].transition = $("#transition").val();
                    LB.PMTC.saveData[$("#saveName").val()].end = $("#end").val();
                    localStorage.setItem("saves", JSON.stringify(LB.PMTC.saveData));
                    LB.PMTC.setSelect(LB.PMTC.saveData, "select"),
                        $("select").val($("#saveName").val());
                    $("#save").html("OK!");
                } else {
                    $("#save").html("No name!")
                }
            });
            $("#load").click(function() {
                LB.PMTC.load($("select :selected").val());
            });
            $("#save").mouseleave(function() {
                $(this).html("SAVE");
            });
            $(".picks input").blur(function() {
                console.log("blurring");
                $(this).parent().removeClass().addClass("flair flair-" + $(this).val().toLowerCase().KWS());
            });
            $("#loading").html("Teams are loaded!");
        });
    </script>
</body>

</html>
